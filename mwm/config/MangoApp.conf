# Keep ordered layout: custom_text starts the FPS row; exec uses its next column.
legacy_layout=0
position=top-left
fps=0
gpu_stats
gpu_temp
cpu_stats
cpu_temp
custom_text=FPS
exec=@MWM_GAME_FPS@
frametime=0
frame_timing
font_size=29
# exec/custom_text use the secondary font, not font_size_text (MangoHud 0.8.4).
font_size_secondary=29
font_size_text=22
height=200
width=245
background_alpha=0.6
table_columns=3
